name: Bug
description: Report incorrect behavior in osm-d.
title: ""
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true

  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer
      description: Include the smallest OSM/PBF input, source, or command that reproduces the problem.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Compiler/version, DUB version, OS/architecture, and relevant build mode.
    validations:
      required: true

  - type: textarea
    id: integrity
    attributes:
      label: Data-integrity impact
      description: Note any loss, normalization, malformed-input, ordering, duplicate, ownership, or failure-semantics implications.
