name: Retire M3 topic branches

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  retire:
    if: github.repository == 'alex-1974/osm-d'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Delete audited absorbed Phase 3 branches
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            docs/pbf-parallel-ownership
            feat/pbf-block-summary
            feat/pbf-worker-core
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "retiring $branch"
              git push origin --delete "$branch"
            else
              echo "already absent: $branch"
            fi
          done
