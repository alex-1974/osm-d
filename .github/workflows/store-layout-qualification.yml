name: M6 Store Qualification

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
    paths:
      - "source/osm/store/**"
      - "source/osm/package.d"
      - "benchmark/store/**"
      - "benchmark/dub.sdl"
      - ".github/workflows/store-layout-qualification.yml"

permissions:
  contents: read

jobs:
  bremen-layout:
    name: Direct PBF store + Bremen qualification
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install LDC performance compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.41.0
          dub: 1.40.0

      - name: Compiler versions
        shell: bash
        run: |
          "$DC" --version
          dub --version

      - name: Fetch pinned M6 workloads
        shell: bash
        run: |
          for dataset in monaco-260901 liechtenstein-260901 bremen-260901; do
            ok=0
            for attempt in 1 2 3 4 5; do
              if bash benchmark/fetch-datasets.sh fetch "$dataset"; then
                ok=1
                break
              fi
              sleep $((attempt * 5))
            done
            test "$ok" = 1
          done

      - name: Build layout benchmark
        shell: bash
        run: |
          dub build \
            --root=benchmark \
            --config=store-layout \
            --compiler="$DC" \
            --build=release \
            --build-mode=allAtOnce \
            --force

      - name: Direct semantic parity on pinned small datasets
        shell: bash
        run: |
          for dataset in monaco-260901 liechtenstein-260901; do
            benchmark/bin/osm-d-bench-store-layout \
              --variant=direct-parity \
              "benchmark/data/geofabrik-2026-09-01/$dataset.osm.pbf" \
              | tee "benchmark/store/direct-parity-$dataset.txt"
            grep -qx 'integrity=pass' \
              "benchmark/store/direct-parity-$dataset.txt"
          done

      - name: Run straightforward reference
        shell: bash
        run: |
          benchmark/bin/osm-d-bench-store-layout \
            --variant=reference \
            benchmark/data/geofabrik-2026-09-01/bremen-260901.osm.pbf \
            | tee benchmark/store/reference-bremen.txt

      - name: Run compact build from materialized dataset
        shell: bash
        run: |
          benchmark/bin/osm-d-bench-store-layout \
            --variant=compact-owned \
            benchmark/data/geofabrik-2026-09-01/bremen-260901.osm.pbf \
            | tee benchmark/store/compact-owned-bremen.txt

      - name: Run compact candidate
        shell: bash
        run: |
          benchmark/bin/osm-d-bench-store-layout \
            --variant=compact \
            benchmark/data/geofabrik-2026-09-01/bremen-260901.osm.pbf \
            | tee benchmark/store/compact-bremen.txt

      - name: Compare semantic and memory results
        shell: bash
        run: |
          get_value() {
            local key="$1"
            local file="$2"
            awk -F= -v key="$key" '$1 == key { print $2 }' "$file"
          }

          ref="benchmark/store/reference-bremen.txt"
          cmp="benchmark/store/compact-bremen.txt"

          for key in semantic_checksum edit_checksum revert_checksum remap_checksum; do
            rv="$(get_value "$key" "$ref")"
            cv="$(get_value "$key" "$cmp")"
            test -n "$rv"
            test "$rv" = "$cv"
            echo "PASS: $key=$rv"
          done

          materialized="benchmark/store/compact-owned-bremen.txt"
          mv="$(get_value semantic_checksum "$materialized")"
          rv="$(get_value semantic_checksum "$ref")"
          test -n "$mv"
          test "$mv" = "$rv"
          echo "PASS: compact-owned semantic_checksum=$mv"

          test "$(get_value integrity "$ref")" = "pass"
          test "$(get_value integrity "$cmp")" = "pass"

          ref_rss="$(get_value final_incremental_rss_kib "$ref")"
          cmp_rss="$(get_value final_incremental_rss_kib "$cmp")"
          cmp_peak="$(get_value peak_incremental_rss_kib "$cmp")"
          ref_owned="$(get_value owned_bytes "$ref")"
          cmp_owned="$(get_value owned_bytes "$cmp")"

          materialized_decode="$(get_value source_decode_ns "$materialized")"
          materialized_layout="$(get_value layout_build_ns "$materialized")"
          direct_build="$(get_value layout_build_ns "$cmp")"

          awk -v d="$direct_build" -v md="$materialized_decode" -v ml="$materialized_layout" 'BEGIN {
            mt = md + ml;
            printf "direct_build_ms=%.3f\n", d / 1000000.0;
            printf "materialized_build_ms=%.3f\n", mt / 1000000.0;
            if (d > 0)
              printf "materialized_over_direct_ratio=%.6f\n", mt / d;
          }' | tee benchmark/store/direct-build-decision.txt

          awk -v p="$cmp_peak" -v f="$cmp_rss" 'BEGIN {
            if (f <= 0) {
              print "direct_peak_ratio=unavailable";
              print "direct_peak_1_5_target=UNAVAILABLE";
            } else {
              printf "direct_peak_ratio=%.6f\n", p / f;
              print "direct_peak_1_5_target=" (p <= 1.5 * f ? "PASS" : "FAIL");
              if (p > 1.5 * f) exit 1;
            }
          }' | tee -a benchmark/store/direct-build-decision.txt

          awk -v r="$ref_rss" -v c="$cmp_rss" 'BEGIN {
            if (r <= 0) {
              print "rss_ratio=unavailable";
            } else {
              printf "rss_ratio=%.6f\n", c / r;
              printf "rss_reduction_percent=%.3f\n", 100.0 * (1.0 - c / r);
            }
          }' | tee benchmark/store/bremen-decision.txt

          awk -v r="$ref_owned" -v c="$cmp_owned" 'BEGIN {
            if (r > 0) {
              printf "owned_ratio=%.6f\n", c / r;
              printf "owned_reduction_percent=%.3f\n", 100.0 * (1.0 - c / r);
            }
          }' | tee -a benchmark/store/bremen-decision.txt

          awk -v c="$cmp_rss" 'BEGIN {
            printf "compact_final_incremental_rss_mib=%.3f\n", c / 1024.0;
            print "low_end_512_mib_target=" (c <= 512 * 1024 ? "PASS" : "FAIL");
            print "stretch_384_mib_target=" (c <= 384 * 1024 ? "PASS" : "FAIL");
          }' | tee -a benchmark/store/bremen-decision.txt

          awk -v r="$ref_rss" -v c="$cmp_rss" 'BEGIN {
            if (r > 0)
              print "reference_75_percent_target=" (c <= 0.75 * r ? "PASS" : "FAIL");
            else
              print "reference_75_percent_target=UNAVAILABLE";
          }' | tee -a benchmark/store/bremen-decision.txt

      - name: Upload qualification evidence
        uses: actions/upload-artifact@v6
        with:
          name: store-layout-bremen-${{ github.sha }}
          path: |
            benchmark/store/reference-bremen.txt
            benchmark/store/compact-owned-bremen.txt
            benchmark/store/compact-bremen.txt
            benchmark/store/bremen-decision.txt
            benchmark/store/direct-build-decision.txt
            benchmark/store/direct-parity-monaco-260901.txt
            benchmark/store/direct-parity-liechtenstein-260901.txt
          if-no-files-found: error
