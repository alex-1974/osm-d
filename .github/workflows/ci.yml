name: Fast

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler-gate:
    name: Fast / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - ldc-1.41.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install D compiler
        id: setup-dlang
        continue-on-error: ${{ startsWith(matrix.compiler, 'dmd-') }}
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}
          dub: 1.40.0

      - name: Fallback to official D installer for DMD
        if: startsWith(matrix.compiler, 'dmd-') && steps.setup-dlang.outcome == 'failure'
        shell: bash
        run: |
          bash tools/setup-dmd-ci.sh "${{ matrix.compiler }}" 1.40.0

      - name: Compiler versions
        shell: bash
        run: |
          echo "DC=$DC"
          "$DC" --version
          dub --version

      - name: Run unit tests
        shell: bash
        run: dub test --compiler="$DC" --force

      - name: Compile external consumer surface
        shell: bash
        run: |
          CONSUMER_COMPILERS="$DC" \
            bash tests/run-consumer-compile.sh

      - name: Qualify osmChange with external toolchain
        if: matrix.compiler == 'dmd-2.111.0'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          OSMCHANGE_COMPILER="$DC" \
            bash tests/run-osmchange-toolchain.sh

      - name: Run editor interoperability fixtures
        shell: bash
        run: |
          dub run \
            --root=tests/edit-interoperability \
            --compiler="$DC" \
            --build=debug \
            --force

      - name: Run M17 semantic editing pipeline
        shell: bash
        run: |
          dub run \
            --root=tests/m17-semantic-pipeline \
            --compiler="$DC" \
            --build=debug \
            --force

      - name: Run M17 Editing API read-response fixtures
        shell: bash
        run: |
          dub run \
            --root=tests/m17-read-responses \
            --compiler="$DC" \
            --build=debug \
            --force

      - name: Run DIP1000 negative tests
        shell: bash
        run: |
          DIP1000_COMPILERS="$DC" \
            tests/run-dip1000-negative.sh

      - name: Run deterministic wire malformed-input seeds
        shell: bash
        run: |
          WIRE_FUZZ_COMPILER="$DC" \
            bash tests/fuzz/run-wire-seeds.sh

      - name: Run deterministic PBF round-trip self-test
        shell: bash
        run: |
          dub run \
            --root=tests/roundtrip \
            --config=pbf-roundtrip \
            --compiler="$DC" \
            --build=debug \
            -- \
            --self-test

      - name: Build release configuration
        shell: bash
        run: dub build --compiler="$DC" --build=release --force

      - name: Build memory baseline benchmark
        shell: bash
        run: |
          dub build \
            --root=benchmark \
            --config=parser-memory-baseline \
            --compiler="$DC" \
            --build=release \
            --build-mode=allAtOnce \
            --force

      - name: Build parallel summary benchmark
        shell: bash
        run: |
          dub build \
            --root=benchmark \
            --config=parser-parallel-summary \
            --compiler="$DC" \
            --build=release \
            --build-mode=allAtOnce \
            --force

      - name: Build M16 area qualification
        shell: bash
        run: |
          dub build \
            --root=benchmark \
            --config=area-qualification \
            --compiler="$DC" \
            --build=release \
            --build-mode=allAtOnce \
            --force

      - name: Build compact-store layout benchmark
        if: matrix.compiler == 'ldc-1.41.0'
        shell: bash
        run: |
          dub build \
            --root=benchmark \
            --config=store-layout \
            --compiler="$DC" \
            --build=release \
            --build-mode=allAtOnce \
            --force
