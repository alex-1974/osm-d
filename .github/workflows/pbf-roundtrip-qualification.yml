name: PBF Round-trip Qualification

on:
  push:
    branches:
      - feat/m4-roundtrip-qualification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-real-data:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-1.41.0
          dub: 1.40.0

      - name: Install independent libosmium reference tool
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool

      - name: Pinned Monaco, Liechtenstein and Bremen semantic round trips
        shell: bash
        run: |
          ROUNDTRIP_COMPILER="$DC" \
            bash tests/roundtrip/run-pinned-roundtrip.sh \
              monaco-260901 \
              liechtenstein-260901 \
              bremen-260901
