name: Create release freeze checkpoint

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix, for example 0.4.0"
        required: true
        type: string
      stage:
        description: "Freeze checkpoint"
        required: true
        type: choice
        options:
          - feature
          - api
      commit:
        description: "Exact reviewed commit SHA"
        required: true
        type: string

permissions:
  contents: write

jobs:
  freeze:
    name: Freeze ${{ inputs.stage }} / ${{ inputs.version }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create or verify immutable annotated freeze tag
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          STAGE: ${{ inputs.stage }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be X.Y.Z without a v prefix" >&2
            exit 2
          fi
          if [[ "$STAGE" != "feature" && "$STAGE" != "api" ]]; then
            echo "stage must be feature or api" >&2
            exit 2
          fi
          if [[ ! "$COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit must be a full 40-character SHA" >&2
            exit 2
          fi

          git fetch origin --tags develop main
          git cat-file -e "$COMMIT^{commit}"

          # A reviewed release checkpoint must belong to the repository's
          # development/release history, not be an arbitrary detached object.
          if ! git merge-base --is-ancestor "$COMMIT" origin/develop &&
             ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "commit is not reachable from develop or main: $COMMIT" >&2
            exit 1
          fi

          tag="freeze/$STAGE-$VERSION"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if [[ "$(git cat-file -t "$tag")" != "tag" ]]; then
              echo "freeze tag exists but is not annotated: $tag" >&2
              exit 1
            fi
            existing="$(git rev-list -n 1 "$tag")"
            if [[ "$existing" != "$COMMIT" ]]; then
              echo "freeze tag points elsewhere: $tag -> $existing" >&2
              exit 1
            fi
            echo "Freeze already exists at requested commit: $tag -> $COMMIT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$COMMIT" -m "osm-d $tag"
          git push origin "refs/tags/$tag"

          echo "Created immutable annotated freeze: $tag -> $COMMIT"
